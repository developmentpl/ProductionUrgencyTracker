<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urgent Orders — Shop Floor TV</title>
  <style>
    /* ── Foundations ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-navy:    #1e3a5f;
      --page-bg:       #f0f2f5;
      --surface:       #ffffff;
      --surface-alt:   #f8fafc;
      --border:        #e2e8f0;
      --border-subtle: #f1f5f9;
      --text:          #1a1a1a;
      --text-muted:    #475569;
      --text-faint:    #94a3b8;
      --danger:        #dc2626;
      --warn:          #d97706;
      --success:       #16a34a;

      --tv-body:       20px;
      --tv-sm:         17px;
      --tv-xs:         14px;
      --tv-hdr:        24px;
      --tv-stat:       42px;
      --tv-wo:         22px;
      --tv-timer:      26px;
      --tv-th:         13px;
      --tv-cell-pad:   18px 22px;
    }

    html, body {
      height: 100%;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: var(--tv-body);
      overflow: hidden;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--brand-navy);
      color: #fff;
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    header h1 {
      font-size: var(--tv-hdr);
      font-weight: 800;
      letter-spacing: .02em;
      color: #fff;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: var(--tv-xs);
      font-weight: 800;
      letter-spacing: .1em;
      color: #86efac;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
      animation: livepulse 2s ease-in-out infinite;
    }

    @keyframes livepulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .5; transform: scale(.85); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-tile {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      padding: 8px 20px;
      text-align: center;
      min-width: 90px;
    }

    .stat-tile .val {
      font-size: var(--tv-stat);
      font-weight: 800;
      line-height: 1;
      display: block;
    }

    .stat-tile .lbl {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: rgba(255,255,255,.6);
      margin-top: 3px;
      display: block;
      white-space: nowrap;
    }

    .stat-tile.t-a .val { color: #fca5a5; }
    .stat-tile.t-b .val { color: #fdba74; }
    .stat-tile.t-total .val { color: #fff; }

    .clock-box {
      font-size: 30px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,.8);
      letter-spacing: .04em;
      min-width: 120px;
      text-align: right;
    }

    .btn-hdr {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.28);
      color: #fff;
      padding: 7px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-hdr:hover { background: rgba(255,255,255,.24); text-decoration: none; }
    .btn-hdr.portal { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }

    /* ── Main ── */
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px 24px 10px;
      gap: 12px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
    }

    .toolbar-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--brand-navy);
      min-width: 280px;
    }

    .toolbar-chips {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip {
      padding: 5px 14px;
      border-radius: 12px;
      font-size: var(--tv-xs);
      font-weight: 700;
    }

    .chip-total   { background: #dbeafe; color: #1d4ed8; }
    .chip-a       { background: #fee2e2; color: #991b1b; }
    .chip-b       { background: #fef3c7; color: #92400e; }
    .chip-c       { background: #fecdd3; color: #9f1239; }

    .refresh-time { font-size: 12px; color: var(--text-faint); }

    /* ── Table section ── */
    .table-section {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-scroll {
      overflow-y: scroll;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 var(--surface-alt);
    }
    .table-scroll::-webkit-scrollbar        { width: 10px; }
    .table-scroll::-webkit-scrollbar-track  { background: var(--surface-alt); }
    .table-scroll::-webkit-scrollbar-thumb  { background: #94a3b8; border-radius: 6px; border: 3px solid var(--surface-alt); }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      min-width: 900px;
    }

    thead { position: sticky; top: 0; z-index: 10; }

    thead th {
      background: var(--surface-alt);
      padding: 12px 22px;
      text-align: left;
      font-size: var(--tv-th);
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .6px;
      white-space: nowrap;
      border-bottom: 3px solid var(--border);
    }
    thead th:first-child { border-radius: 8px 0 0 0; }
    thead th:last-child  { border-radius: 0 8px 0 0; }

    /* Bordered, card-like rows */
    tbody tr td {
      border-top:    2px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: var(--tv-cell-pad);
      vertical-align: middle;
      font-size: var(--tv-body);
      background: var(--surface);
      transition: background .1s;
    }
    tbody tr td:first-child { border-left: 2px solid var(--border); border-radius: 10px 0 0 10px; }
    tbody tr td:last-child  { border-right: 2px solid var(--border); border-radius: 0 10px 10px 0; }

    tbody tr:hover td           { background: var(--surface-alt); }
    tbody tr.row-overdue td     { background: #fef2f2; border-color: #fecaca; }
    tbody tr.row-overdue:hover td { background: #fee2e2; }

    /* Priority accent bars */
    tbody tr.pri-is-critical td:first-child { border-left: 6px solid var(--danger); }
    tbody tr.pri-is-high     td:first-child { border-left: 6px solid var(--warn); }
    tbody tr.pri-is-medium   td:first-child { border-left: 6px solid #eab308; }
    tbody tr.pri-is-low      td:first-child { border-left: 6px solid var(--success); }

    /* ── Column classes ── */
    td.col-no {
      text-align: center;
      color: var(--text-faint);
      font-size: var(--tv-xs);
      font-weight: 700;
      width: 44px;
    }

    td.wo-id {
      font-size: var(--tv-wo);
      font-weight: 800;
      color: var(--brand-navy);
      font-family: 'Courier New', monospace;
      letter-spacing: .03em;
      width: 120px;
    }

    td.material {
      font-weight: 600;
      color: var(--text);
      max-width: 300px;
    }

    td.customer {
      color: var(--text-muted);
      font-weight: 500;
      max-width: 200px;
    }

    .pri-text { font-weight: 800; font-size: var(--tv-body); }
    .pri-critical { color: var(--danger); }
    .pri-high     { color: var(--danger); }
    .pri-medium   { color: var(--warn); }
    .pri-low      { color: var(--success); }

    td.submitted-td { color: var(--text-muted); font-size: var(--tv-sm); }

    .countdown {
      font-family: 'Courier New', monospace;
      font-size: var(--tv-timer);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      display: inline-block;
      min-width: 160px;
    }
    .cnt-overdue  { color: var(--danger); }
    .cnt-critical { color: var(--danger); }
    .cnt-warning  { color: var(--warn); }
    .cnt-ok       { color: var(--success); }

    td.remarks-td {
      color: var(--text-faint);
      font-size: var(--tv-sm);
      font-style: italic;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 12px;
      color: var(--text-faint);
    }
    .empty-state .icon { font-size: 3rem; }
    .empty-state p     { font-size: 20px; font-weight: 600; }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      color: var(--text-faint);
    }
    footer strong { color: var(--text-muted); }

    .admin-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .admin-link:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      :root { --tv-body:16px; --tv-sm:14px; --tv-stat:32px; --tv-wo:17px; --tv-timer:20px; --tv-cell-pad:13px 16px; }
      header { height: 64px; }
    }

    @media (max-width: 768px) {
      :root { --tv-body:13px; --tv-sm:12px; --tv-xs:11px; --tv-hdr:15px; --tv-stat:24px; --tv-wo:13px; --tv-timer:15px; --tv-th:10px; --tv-cell-pad:10px 12px; }
      html, body { overflow: auto; height: auto; }
      .shell { height: auto; min-height: 100svh; }
      main { overflow: visible; }
      .table-section { min-height: 60vh; }
      header { height: auto; min-height: 54px; padding: 8px 14px; flex-wrap: wrap; gap: 8px; }
      header h1 { font-size: 14px; }
      .header-right { flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
      .stat-tile { padding: 5px 10px; min-width: 58px; }
      .stat-tile .val { font-size: 20px; }
      .stat-tile.t-b { display: none; }
      .clock-box { font-size: 18px; min-width: 80px; }
      .btn-hdr { padding: 5px 10px; font-size: 11px; }
      main { padding: 8px 10px 6px; gap: 8px; }
      .toolbar { flex-wrap: wrap; padding: 8px 12px; }
      .toolbar-chips { margin-left: 0; flex-wrap: wrap; }
      table { min-width: 600px; border-spacing: 0 5px; }
      tbody tr td:first-child { border-radius: 6px 0 0 6px; }
      tbody tr td:last-child  { border-radius: 0 6px 6px 0; }
      footer { flex-wrap: wrap; font-size: 11px; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- ── Header ── -->
  <header>
    <div class="header-left">
      <h1>🚨 Urgent Dispatch Orders</h1>
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>
    </div>
    <div class="header-right">
      <div class="stat-tile t-a">
        <span class="val" id="stat-a">0</span>
        <span class="lbl">Critical</span>
      </div>
      <div class="stat-tile t-b">
        <span class="val" id="stat-b">0</span>
        <span class="lbl">High</span>
      </div>
      <div class="stat-tile t-total">
        <span class="val" id="stat-total">0</span>
        <span class="lbl">Total</span>
      </div>
      <div class="clock-box" id="clock">--:--:--</div>
      <a href="https://operation.yotser.in/" class="btn-hdr portal">🏠 Portal</a>
      <a href="/urgency/admin" class="btn-hdr">⚙️ Admin</a>
    </div>
  </header>

  <!-- ── Main ── -->
  <main>

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="toolbar-title">🚨 Urgent Dispatch Orders</span>

      <div class="toolbar-chips">
        <span class="chip chip-total" id="chip-total">Total: 0</span>
        <span class="chip chip-a"     id="chip-a">Critical: 0</span>
        <span class="chip chip-b"     id="chip-b">High: 0</span>
        <span class="chip chip-c"     id="chip-c" style="display:none;"></span>
        <span class="refresh-time"    id="last-refresh">—</span>
      </div>
    </div>

    <!-- Admin-pushed urgent orders -->
    <div class="table-section">
      <div class="table-scroll" id="scroll">
        <div id="container">
          <div class="empty-state"><div class="icon">⏳</div><p>Loading urgent orders…</p></div>
        </div>
      </div>
    </div>

  </main>

  <!-- ── Footer ── -->
  <footer>
    <span>Production Urgency Tracker — <strong>operation.yotser.in</strong></span>
    <span>Auto-refreshes every 30s</span>
    <span>
      <a href="/urgency/admin" class="admin-link">⚙️ Admin Panel</a>
      &nbsp;&nbsp;
      <span id="footer-time">—</span>
    </span>
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const API            = '/urgency';
const REFRESH_MS     = 30_000;    // data refresh interval
const SCROLL_PX_SEC  = 40;        // auto-scroll speed (px per second)
const WAIT_TOP_MS    = 5000;      // pause at top before scrolling down
const WAIT_BOTTOM_MS = 4000;      // pause at bottom before returning to top
const RECHECK_MS     = 5000;      // re-check for overflow when all rows fit

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let urgentOrders = [];
let scrollRAF    = null;
let scrollTimer  = null;
let firstLoad    = true;

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function getCountdown(dl) {
  const diff = new Date(dl) - Date.now();
  if (diff <= 0) {
    const over = Math.abs(Math.floor(diff / 1000));
    const h = Math.floor(over / 3600), m = Math.floor((over % 3600) / 60);
    return { text: `+${h}h ${m}m overdue`, cls: 'cnt-overdue', isOverdue: true };
  }
  const total = Math.floor(diff / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = n => String(n).padStart(2, '0');
  const cls = diff < 3_600_000 ? 'cnt-critical' : diff < 14_400_000 ? 'cnt-warning' : 'cnt-ok';
  return { text: `${pad(h)}:${pad(m)}:${pad(s)}`, cls, isOverdue: false };
}

// ═══════════════════════════════════════════════════════════════
//  CLOCK
// ═══════════════════════════════════════════════════════════════
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-IN', { hour12: true });
  document.getElementById('footer-time').textContent =
    new Date().toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12: true });
}
setInterval(updateClock, 1000);
updateClock();

// ═══════════════════════════════════════════════════════════════
//  COUNTDOWN TICK
// ═══════════════════════════════════════════════════════════════
function tickCountdowns() {
  document.querySelectorAll('.countdown[data-deadline]').forEach(el => {
    const { text, cls, isOverdue } = getCountdown(el.dataset.deadline);
    el.textContent = (isOverdue ? '⚠ ' : '') + text;
    el.className   = `countdown ${cls}`;
  });
}
setInterval(tickCountdowns, 1000);

// ═══════════════════════════════════════════════════════════════
//  RENDER — Admin urgent orders
// ═══════════════════════════════════════════════════════════════
const PRI_RANK = { critical: 0, high: 1, medium: 2, low: 3 };

function renderUrgentOrders(data) {
  const container = document.getElementById('container');
  if (!data.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No urgent dispatch orders — all clear!</p></div>`;
    return;
  }

  const sorted = [...data].sort((a, b) => {
    const pa = PRI_RANK[(a.priority || '').toLowerCase()] ?? 9;
    const pb = PRI_RANK[(b.priority || '').toLowerCase()] ?? 9;
    return pa !== pb ? pa - pb : new Date(a.deadline) - new Date(b.deadline);
  });

  const rows = sorted.map((o, i) => {
    const priKey = (o.priority || 'low').toLowerCase();
    const { text, cls, isOverdue } = getCountdown(o.deadline);
    const submitted = new Date(o.submitted_at).toLocaleString('en-IN', {
      day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', hour12: true
    });
    const rowCls = [`pri-is-${priKey}`, isOverdue ? 'row-overdue' : ''].filter(Boolean).join(' ');
    return `
      <tr class="${rowCls}">
        <td class="col-no">${i + 1}</td>
        <td class="wo-id">${esc(o.wo_number)}</td>
        <td class="material">${esc(o.material || '—')}</td>
        <td class="customer">${esc(o.customer)}</td>
        <td><span class="pri-text pri-${priKey}">${esc(o.priority)}</span></td>
        <td class="submitted-td">${submitted}</td>
        <td><span class="countdown ${cls}" data-deadline="${esc(o.deadline)}">${isOverdue ? '⚠ ' : ''}${text}</span></td>
        <td class="remarks-td" title="${esc(o.remarks || '')}">${esc(o.remarks || '—')}</td>
      </tr>`;
  }).join('');

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="width:44px; text-align:center;">#</th>
          <th style="width:120px;">WO No.</th>
          <th style="width:260px;">Work Order Name</th>
          <th style="width:200px;">Customer</th>
          <th style="width:110px;">Priority</th>
          <th style="width:140px;">Submitted</th>
          <th style="width:185px;">⏱ Time Left</th>
          <th>Remarks</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ═══════════════════════════════════════════════════════════════
//  STATS UPDATE
// ═══════════════════════════════════════════════════════════════
function updateStats() {
  const total    = urgentOrders.length;
  const critical = urgentOrders.filter(o => (o.priority || '').toLowerCase() === 'critical').length;
  const high     = urgentOrders.filter(o => (o.priority || '').toLowerCase() === 'high').length;
  const overdue  = urgentOrders.filter(o => new Date(o.deadline) < Date.now()).length;

  document.getElementById('stat-a').textContent     = critical;
  document.getElementById('stat-b').textContent     = high;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('chip-total').textContent = `Total: ${total}`;
  document.getElementById('chip-a').textContent     = `Critical: ${critical}`;
  document.getElementById('chip-b').textContent     = `High: ${high}`;
  const chipC = document.getElementById('chip-c');
  chipC.textContent   = `Overdue: ${overdue}`;
  chipC.style.display = overdue ? '' : 'none';
}

// ═══════════════════════════════════════════════════════════════
//  AUTO-SCROLL LOOP
// ═══════════════════════════════════════════════════════════════
// Pause at the top, scroll slowly to the bottom, pause, return to the top
// and repeat. When every row fits on screen there is nothing to scroll, so
// it just re-checks now and then in case a refresh brought in more rows.
function stopScroll() {
  if (scrollRAF)   { cancelAnimationFrame(scrollRAF); scrollRAF   = null; }
  if (scrollTimer) { clearTimeout(scrollTimer);        scrollTimer = null; }
}

function startScroll() {
  stopScroll();
  const scrollEl = document.getElementById('scroll');
  scrollEl.scrollTo({ top: 0, behavior: 'smooth' });

  scrollTimer = setTimeout(() => {
    if (scrollEl.scrollHeight - scrollEl.clientHeight <= 20) {
      scrollTimer = setTimeout(startScroll, RECHECK_MS);
      return;
    }

    let pos    = scrollEl.scrollTop;
    let lastTs = null;

    function frame(ts) {
      if (!lastTs) { lastTs = ts; scrollRAF = requestAnimationFrame(frame); return; }

      pos += SCROLL_PX_SEC * ((ts - lastTs) / 1000);
      lastTs = ts;

      // Re-measured every frame: a refresh may add or remove rows mid-scroll
      const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
      if (pos >= maxScroll) {
        scrollEl.scrollTop = maxScroll;
        // Reached bottom — wait, then go back to the top
        scrollTimer = setTimeout(startScroll, WAIT_BOTTOM_MS);
        return;   // stop RAF
      }

      scrollEl.scrollTop = pos;
      scrollRAF = requestAnimationFrame(frame);
    }

    scrollRAF = requestAnimationFrame(frame);
  }, WAIT_TOP_MS);
}

// ═══════════════════════════════════════════════════════════════
//  DATA FETCH
// ═══════════════════════════════════════════════════════════════
async function fetchAll() {
  try {
    const json = await (await fetch(`${API}/api/urgent-orders`)).json();
    if (json.success) urgentOrders = json.data || [];
  } catch { /* keep showing the last good data */ }

  // Re-rendering keeps the scroll position, so the loop carries on smoothly
  renderUrgentOrders(urgentOrders);
  updateStats();

  if (firstLoad) {
    firstLoad = false;
    startScroll();
  }

  document.getElementById('last-refresh').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-IN', { hour12: true });
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
fetchAll();
setInterval(fetchAll, REFRESH_MS);
</script>
